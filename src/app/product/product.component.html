<main class="productCard">
  <img src="{{ item.image }}" alt="product-image" />

  <section class="productCardSection">
    <h3>{{ item.title }}</h3>
    <p>{{ item.description }}</p>
    <p>{{ item.price }}</p>
    <p>{{ item.category }}</p>
    <p>Count:{{ item.rating.count }} Rate: {{ item.rating.rate }}</p>

    <button (click)="addProductToCart(item)">Add to cart</button>
  </section>
</main>
